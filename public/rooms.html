<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms — The Curly Babus</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div><div class="page-title">🛏 Rooms</div><div class="page-subtitle">Room assignments per property</div></div>
      <button class="btn btn-primary" onclick="openAddRoom()">+ Add Room</button>
    </div>
    <div id="rooms-content">Loading...</div>
  </main>
</div>
<div class="modal-overlay" id="room-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><div class="modal-title" id="rm-title">Add Room</div><button class="modal-close" onclick="closeModal('room-modal')">✕</button></div>
    <div class="form-grid">
      <div class="form-group full"><label>Property *</label><select id="rm-prop"><option value="">Select property</option></select></div>
      <div class="form-group full"><label>Room Name *</label><input id="rm-name" placeholder="Master Bedroom"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('room-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveRoom()">Save</button>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
checkAuth(); renderNav();
let editRoomId = null;
async function load() {
  const [props, rooms, guests] = await Promise.all([api('/properties'), api('/rooms'), api('/guests')]);
  const guestsByRoom = {};
  for (const g of guests) {
    if (g.room_id) {
      if (!guestsByRoom[g.room_id]) guestsByRoom[g.room_id] = [];
      guestsByRoom[g.room_id].push(g);
    }
  }
  const rm = document.getElementById('rm-prop');
  rm.innerHTML = '<option value="">Select property</option>' + props.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  if (!props.length) {
    document.getElementById('rooms-content').innerHTML = '<div class="empty-state"><div class="icon">🏠</div>Add a property first to create rooms</div>';
    return;
  }
  document.getElementById('rooms-content').innerHTML = props.map(p => {
    const propRooms = rooms.filter(r => r.property_id === p.id);
    return `
      <div class="card mb-4">
        <div class="card-header">
          <div class="card-title">${p.name}</div>
          <div class="text-xs text-muted">${p.checkin_date} → ${p.checkout_date}</div>
        </div>
        ${propRooms.length ? `
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
            ${propRooms.map(r => {
              const occupants = guestsByRoom[r.id] || [];
              return `
                <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:14px">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div style="font-weight:600;color:var(--text-1)">${r.name}</div>
                    <button class="btn btn-danger btn-sm" onclick="deleteRoom(${r.id})">✕</button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:4px">
                    ${occupants.length ? occupants.map(g => `
                      <div style="font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px">
                        <span class="dot dot-${g.status}"></span> ${g.name}
                      </div>`).join('') : '<div style="font-size:12px;color:var(--text-3)">Unoccupied</div>'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : '<div class="empty-state" style="padding:20px">No rooms added for this property</div>'}
      </div>
    `;
  }).join('');
}
function openAddRoom() {
  editRoomId = null;
  document.getElementById('rm-title').textContent = 'Add Room';
  document.getElementById('rm-name').value = '';
  document.getElementById('rm-prop').value = '';
  openModal('room-modal');
}
async function saveRoom() {
  const body = { property_id: parseInt(document.getElementById('rm-prop').value), name: document.getElementById('rm-name').value };
  if (!body.property_id || !body.name) { toast('Property and name required','error'); return; }
  await api('/rooms', 'POST', body);
  closeModal('room-modal'); toast('Room added'); load();
}
async function deleteRoom(id) {
  if (!confirm('Delete this room? Guests assigned here will be unassigned.')) return;
  await api(`/rooms/${id}`, 'DELETE'); toast('Deleted'); load();
}
load();
</script>
</body>
</html>
