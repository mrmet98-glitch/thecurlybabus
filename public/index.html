<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Curly Babus</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .login-input{text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:2px;padding:14px;margin-bottom:14px}
    .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
    .palm{font-size:48px;margin-bottom:16px;display:block}
  </style>
</head>
<body>
  <div class="login-page">
    <div class="grid-bg"></div>
    <div class="login-box">
      <span class="palm">🌴</span>
      <div class="login-logo">The Curly Babus</div>
      <input type="password" class="login-input" id="pwd" placeholder="enter password" autocomplete="current-password">
      <button class="btn btn-primary w-full" onclick="login()" style="justify-content:center;padding:14px">
        Enter Dashboard →
      </button>
      <div id="err" style="color:var(--red);font-size:12px;margin-top:10px;display:none">Wrong password</div>
    </div>
  </div>
  <script>
    // If already logged in, redirect
    if (localStorage.getItem('btpwd')) window.location.href = '/dashboard.html';

    async function login() {
      const pwd = document.getElementById('pwd').value;
      const res = await fetch('/api/dashboard', { headers: { 'X-Password': pwd } });
      if (res.status === 401) {
        document.getElementById('err').style.display = 'block';
      } else {
        localStorage.setItem('btpwd', pwd);
        window.location.href = '/dashboard.html';
      }
    }
    document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
