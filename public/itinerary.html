<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itinerary — Bachelor HQ</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div><div class="page-title">🗓 Itinerary</div><div class="page-subtitle">Events, activities, dining — full trip schedule</div></div>
      <button class="btn btn-primary" onclick="openAddEvent()">+ Add Event</button>
    </div>
    <div id="calendar-view">Loading...</div>
  </main>
</div>

<!-- Event Modal -->
<div class="modal-overlay" id="event-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header"><div class="modal-title" id="evt-modal-title">Add Event</div><button class="modal-close" onclick="closeModal('event-modal')">✕</button></div>
    <div class="form-grid">
      <div class="form-group full"><label>Event Title *</label><input id="evt-title" placeholder="Dinner at Nobu"></div>
      <div class="form-group"><label>Date *</label><input id="evt-date" type="date"></div>
      <div class="form-group"><label>Start Time</label><input id="evt-start" type="time"></div>
      <div class="form-group"><label>End Time</label><input id="evt-end" type="time"></div>
      <div class="form-group"><label>Category</label><select id="evt-cat"><option value="">None</option></select></div>
      <div class="form-group"><label>Total Cost ($)</label><input id="evt-cost" type="number" step="0.01" placeholder="0.00"></div>
      <div class="form-group full"><label>Location</label><input id="evt-loc" placeholder="123 Main St"></div>
      <div class="form-group full"><label>Description</label><textarea id="evt-desc"></textarea></div>
      <div class="form-group full"><label>Assign Guests</label>
        <div id="evt-guests-cb" style="display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow-y:auto;padding:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px"></div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="selectAllGuests(true)">Select All</button>
          <button class="btn btn-ghost btn-sm" onclick="selectAllGuests(false)">Clear</button>
        </div>
      </div>
      <div class="form-group full"><label>Notes</label><textarea id="evt-notes" style="min-height:50px"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('event-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
checkAuth(); renderNav();
let events = [], guests = [], cats = [], editEventId = null;

async function load() {
  [events, guests, cats] = await Promise.all([api('/events'), api('/guests'), api('/event-categories')]);
  renderCalendar();
  populateForm();
}

function populateForm() {
  const catSel = document.getElementById('evt-cat');
  catSel.innerHTML = '<option value="">None</option>' + cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const gcb = document.getElementById('evt-guests-cb');
  gcb.innerHTML = guests.map(g => `
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;text-transform:none;letter-spacing:0;color:var(--text-1);padding:4px 6px;background:var(--bg-card);border-radius:4px">
      <input type="checkbox" class="evt-guest-cb" value="${g.id}" style="width:auto">
      ${g.name}
      ${statusBadge(g.status)}
    </label>
  `).join('');
}

function selectAllGuests(checked) {
  document.querySelectorAll('.evt-guest-cb').forEach(cb => cb.checked = checked);
}

function openAddEvent() {
  editEventId = null;
  document.getElementById('evt-modal-title').textContent = 'Add Event';
  ['evt-title','evt-date','evt-start','evt-end','evt-loc','evt-desc','evt-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('evt-cost').value = '';
  document.getElementById('evt-cat').value = '';
  document.querySelectorAll('.evt-guest-cb').forEach(cb => cb.checked = false);
  openModal('event-modal');
}

async function editEvent(id) {
  const evt = events.find(e => e.id === id);
  if (!evt) return;
  editEventId = id;
  document.getElementById('evt-modal-title').textContent = 'Edit Event';
  document.getElementById('evt-title').value = evt.title;
  document.getElementById('evt-date').value = evt.event_date;
  document.getElementById('evt-start').value = evt.start_time||'';
  document.getElementById('evt-end').value = evt.end_time||'';
  document.getElementById('evt-cat').value = evt.category_id||'';
  document.getElementById('evt-cost').value = evt.total_cost||'';
  document.getElementById('evt-loc').value = evt.location||'';
  document.getElementById('evt-desc').value = evt.description||'';
  document.getElementById('evt-notes').value = evt.notes||'';
  const gids = (evt.guests||[]).map(g => g.id);
  document.querySelectorAll('.evt-guest-cb').forEach(cb => cb.checked = gids.includes(parseInt(cb.value)));
  openModal('event-modal');
}

async function saveEvent() {
  const title = document.getElementById('evt-title').value.trim();
  const date = document.getElementById('evt-date').value;
  if (!title || !date) { toast('Title and date required','error'); return; }
  const guest_ids = [...document.querySelectorAll('.evt-guest-cb:checked')].map(cb => parseInt(cb.value));
  const body = {
    title, event_date: date,
    start_time: document.getElementById('evt-start').value||null,
    end_time: document.getElementById('evt-end').value||null,
    category_id: document.getElementById('evt-cat').value||null,
    total_cost: parseFloat(document.getElementById('evt-cost').value)||null,
    location: document.getElementById('evt-loc').value,
    description: document.getElementById('evt-desc').value,
    notes: document.getElementById('evt-notes').value,
    guest_ids
  };
  try {
    if (editEventId) await api(`/events/${editEventId}`, 'PUT', body);
    else await api('/events', 'POST', body);
    closeModal('event-modal');
    toast('Event saved');
    events = await api('/events');
    renderCalendar();
  } catch(e) { toast(e.message,'error'); }
}

async function deleteEvent(id) {
  if (!confirm('Delete this event?')) return;
  await api(`/events/${id}`, 'DELETE');
  toast('Event deleted');
  events = await api('/events');
  renderCalendar();
}

function renderCalendar() {
  if (!events.length) {
    document.getElementById('calendar-view').innerHTML = '<div class="empty-state"><div class="icon">🗓️</div>No events yet. Add some!</div>';
    return;
  }
  const byDate = {};
  for (const e of events) {
    if (!byDate[e.event_date]) byDate[e.event_date] = [];
    byDate[e.event_date].push(e);
  }
  document.getElementById('calendar-view').innerHTML = Object.entries(byDate).sort(([a],[b]) => a.localeCompare(b)).map(([date, dayEvts]) => {
    const d = new Date(date + 'T00:00:00');
    const dayName = d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    const dayNum = d.getDate();
    const monthStr = d.toLocaleDateString('en-US',{month:'short'}).toUpperCase();
    return `
      <div class="cal-day">
        <div class="cal-day-header">
          <div class="cal-date-num">${dayNum}</div>
          <div><div class="cal-day-name">${dayName}</div><div class="cal-month">${monthStr}</div></div>
          <div style="margin-left:auto;font-size:12px;color:var(--text-3)">${dayEvts.length} event${dayEvts.length>1?'s':''}</div>
        </div>
        <div class="cal-events">
          ${dayEvts.sort((a,b) => (a.start_time||'').localeCompare(b.start_time||'')).map(evt => {
            const catName = evt.category_name || 'Misc';
            const perPerson = evt.total_cost && evt.guest_count > 0 ? evt.total_cost / evt.guest_count : 0;
            return `
              <div class="cal-event cat-${catName}" onclick="editEvent(${evt.id})">
                <div class="cal-event-time">
                  ${evt.start_time ? evt.start_time.slice(0,5) : 'All day'}
                  ${evt.end_time ? ' – ' + evt.end_time.slice(0,5) : ''}
                </div>
                <div class="cal-event-content">
                  <div class="cal-event-title">${evt.title}</div>
                  <div class="cal-event-meta">
                    ${evt.location ? `📍 ${evt.location} · ` : ''}
                    <span style="color:var(--text-3)">${catName}</span>
                    ${evt.guest_count > 0 ? ` · ${evt.guest_count} guests` : ''}
                    ${evt.total_cost ? ` · ${fmtMoney(evt.total_cost)} total${perPerson ? ' (' + fmtMoney(perPerson) + '/ea)' : ''}` : ''}
                  </div>
                </div>
                <button class="btn btn-danger btn-sm" style="flex-shrink:0" onclick="event.stopPropagation();deleteEvent(${evt.id})">✕</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

load();
</script>
</body>
</html>
