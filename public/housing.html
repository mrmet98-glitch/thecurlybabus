<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Housing — Bachelor HQ</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div><div class="page-title">🏠 Housing</div><div class="page-subtitle">Pooled Airbnb costs — auto-split per confirmed guest per night</div></div>
      <button class="btn btn-primary" onclick="openModal('prop-modal')">+ Add Property</button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-value" id="h-total">—</div><div class="stat-label">Total Cost</div></div>
      <div class="stat-card"><div class="stat-value" id="h-nights">—</div><div class="stat-label">Total Nights</div></div>
      <div class="stat-card"><div class="stat-value" id="h-nightly">—</div><div class="stat-label">Avg Nightly</div></div>
      <div class="stat-card green"><div class="stat-value" id="h-props">—</div><div class="stat-label">Properties</div></div>
    </div>

    <!-- Properties -->
    <div class="card mb-4">
      <div class="card-header"><div class="card-title">Properties</div></div>
      <div id="props-list">Loading...</div>
    </div>

    <!-- Per-Guest Breakdown -->
    <div class="card">
      <div class="card-header"><div class="card-title">Per-Guest Housing Cost</div><div class="text-xs text-muted">Confirmed guests only</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Guest</th><th>Nights</th><th>Housing Owed</th><th>Paid</th><th>Remaining</th><th>Status</th></tr></thead>
          <tbody id="housing-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add Property Modal -->
<div class="modal-overlay" id="prop-modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="prop-modal-title">Add Property</div><button class="modal-close" onclick="closeModal('prop-modal')">✕</button></div>
    <div class="form-grid">
      <div class="form-group full"><label>Property Name *</label><input id="p-name" placeholder="Airbnb Casa del Sol"></div>
      <div class="form-group full"><label>Total Cost ($) *</label><input id="p-cost" type="number" step="0.01" placeholder="2500.00"></div>
      <div class="form-group"><label>Check-In Date *</label><input id="p-checkin" type="date"></div>
      <div class="form-group"><label>Check-Out Date *</label><input id="p-checkout" type="date"></div>
      <div class="form-group full"><label>Address</label><input id="p-address" placeholder="123 Main St, Scottsdale AZ"></div>
      <div class="form-group full"><label>Notes</label><textarea id="p-notes" style="min-height:60px"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('prop-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProp()">Save Property</button>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
checkAuth(); renderNav();
let editPropId = null;

async function load() {
  const [props, calc] = await Promise.all([api('/properties'), api('/housing/calculation')]);
  document.getElementById('h-props').textContent = props.length;
  document.getElementById('h-total').textContent = fmtMoney(calc.totalCost || 0);
  document.getElementById('h-nights').textContent = calc.totalNights || 0;
  document.getElementById('h-nightly').textContent = fmtMoney(calc.nightlyCost || 0);

  document.getElementById('props-list').innerHTML = props.length ? props.map(p => {
    const nights = (new Date(p.checkout_date) - new Date(p.checkin_date)) / 86400000;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-weight:600;color:var(--text-1)">${p.name}</div>
          <div style="font-size:12px;color:var(--text-2)">${p.checkin_date} → ${p.checkout_date} · ${nights} nights${p.address ? ' · ' + p.address : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <div class="mono" style="font-size:16px;font-weight:700;color:var(--accent)">${fmtMoney(p.total_cost)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="editProp(${p.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProp(${p.id})">Del</button>
          </div>
        </div>
      </div>
    `;
  }).join('') : '<div class="empty-state"><div class="icon">🏠</div>No properties yet</div>';

  const tbody = document.getElementById('housing-tbody');
  if (calc.guests && calc.guests.length) {
    tbody.innerHTML = calc.guests.map(g => {
      const remaining = Math.max(0, g.calculated - (g.housing_paid||0));
      const payStatus = (g.housing_paid||0) >= g.calculated && g.calculated > 0
        ? '<span class="badge badge-confirmed">Paid</span>'
        : (g.housing_paid||0) > 0 ? '<span class="badge badge-maybe">Partial</span>'
        : '<span class="badge badge-cant_make_it">Unpaid</span>';
      return `
        <tr>
          <td><a href="/guest-profile.html?id=${g.id}" style="color:var(--text-1);font-weight:600;text-decoration:none">${g.name}</a></td>
          <td class="mono">${g.nights_staying} nights${g.override ? ' <span class="text-xs text-amber">(override)</span>' : ''}</td>
          <td class="mono text-amber">${fmtMoney(g.calculated)}</td>
          <td class="mono text-green">${fmtMoney(g.housing_paid||0)}</td>
          <td class="mono text-red">${fmtMoney(remaining)}</td>
          <td>${payStatus}</td>
        </tr>
      `;
    }).join('');
  } else {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No confirmed guests with trip dates</td></tr>';
  }
}

function openAddProp() {
  editPropId = null;
  document.getElementById('prop-modal-title').textContent = 'Add Property';
  ['p-name','p-cost','p-checkin','p-checkout','p-address','p-notes'].forEach(id => document.getElementById(id).value = '');
  openModal('prop-modal');
}

async function editProp(id) {
  const props = await api('/properties');
  const p = props.find(x => x.id === id);
  if (!p) return;
  editPropId = id;
  document.getElementById('prop-modal-title').textContent = 'Edit Property';
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-cost').value = p.total_cost;
  document.getElementById('p-checkin').value = p.checkin_date;
  document.getElementById('p-checkout').value = p.checkout_date;
  document.getElementById('p-address').value = p.address||'';
  document.getElementById('p-notes').value = p.notes||'';
  openModal('prop-modal');
}

async function saveProp() {
  const body = {
    name: document.getElementById('p-name').value,
    total_cost: parseFloat(document.getElementById('p-cost').value)||0,
    checkin_date: document.getElementById('p-checkin').value,
    checkout_date: document.getElementById('p-checkout').value,
    address: document.getElementById('p-address').value,
    notes: document.getElementById('p-notes').value
  };
  if (!body.name || !body.checkin_date || !body.checkout_date) { toast('Name, check-in, and check-out are required','error'); return; }
  try {
    if (editPropId) await api(`/properties/${editPropId}`, 'PUT', body);
    else await api('/properties', 'POST', body);
    closeModal('prop-modal');
    toast('Property saved');
    load();
  } catch(e) { toast(e.message,'error'); }
}

async function deleteProp(id) {
  if (!confirm('Delete this property?')) return;
  await api(`/properties/${id}`, 'DELETE');
  toast('Property deleted');
  load();
}

// Override the openModal for prop to ensure form is cleared on + Add click
document.querySelector('.btn-primary[onclick="openModal(\'prop-modal\')"]')?.setAttribute('onclick', 'openAddProp()');
load();
</script>
</body>
</html>
