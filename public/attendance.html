<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — Bachelor HQ</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout">
  <div id="nav-placeholder"></div>
  <main class="main-content">
    <div class="page-header">
      <div><div class="page-title">📅 Attendance</div><div class="page-subtitle">Who's there each night</div></div>
    </div>
    <div id="att-content">Loading...</div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
checkAuth(); renderNav();
async function load() {
  const data = await api('/attendance');
  if (!data || !data.length) {
    document.getElementById('att-content').innerHTML = '<div class="empty-state"><div class="icon">📅</div>Set property dates and guest trip dates to see attendance</div>';
    return;
  }
  const maxCount = Math.max(...data.map(d => d.confirmed + d.maybe + d.adi), 1);
  document.getElementById('att-content').innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Nightly Headcount</div><div class="text-xs text-muted">Bar width = % of max attendance</div></div>
      ${data.map(day => {
        const total = day.confirmed + day.maybe + day.adi;
        const pct = Math.round(total / maxCount * 100);
        const d = new Date(day.date + 'T00:00:00');
        const dayName = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
        return `
          <div class="attendance-day-row" style="margin-bottom:10px">
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-3);min-width:110px">${dayName}</div>
            <div style="flex:1;height:28px;background:var(--bg-elevated);border-radius:4px;overflow:hidden;position:relative">
              <div style="height:100%;background:linear-gradient(90deg,var(--accent),#38bdf8);width:${pct}%;transition:width .5s ease;display:flex;align-items:center;padding-left:10px">
                ${pct > 20 ? `<span style="font-size:11px;color:#fff;font-family:var(--font-mono)">${total} people</span>` : ''}
              </div>
              ${pct <= 20 && total > 0 ? `<span style="position:absolute;left:${pct}% + 8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-2);margin-left:${pct}% + 8px;padding-left:${pct+2}%">${total}</span>` : ''}
            </div>
            <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-2);min-width:80px;text-align:right">
              <span style="color:var(--green)">${day.confirmed}✓</span>
              ${day.maybe > 0 ? ` <span style="color:var(--amber)">${day.maybe}?</span>` : ''}
              ${day.adi > 0 ? ` <span style="color:#ff6b6b">${day.adi}?!</span>` : ''}
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;padding-left:110px;margin-bottom:10px">
            ${day.guests.map(g => `<span class="group-tag" style="background:${g.status==='confirmed'?'var(--green-dim)':g.status==='adi'?'var(--adi-dim)':'var(--amber-dim)'};color:${g.status==='confirmed'?'var(--green)':g.status==='adi'?'#ff6b6b':'var(--amber)'}">${g.name.split(' ')[0]}</span>`).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}
load();
</script>
</body>
</html>
